name: studio-luce

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Edit source on the host. Keep installed packages inside the container.
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  web_node_modules:
