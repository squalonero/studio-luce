name: studio-luce

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Edit source on the host. Keep installed packages inside the container.
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  # Static preview of `out/`, which is what Cloudflare Pages serves.
  # Start it with: docker compose --profile preview up --build preview
  preview:
    profiles: ["preview"]
    build:
      context: .
      target: preview
    ports:
      - "8080:80"

volumes:
  web_node_modules:
