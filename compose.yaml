name: studio-luce

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      # Edit source on the host. Keep installed packages inside the container.
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  # Publishes the static export. Requires CLOUDFLARE_ACCOUNT_ID and
  # CLOUDFLARE_API_TOKEN in the shell or in the gitignored .env file.
  # Start it with: docker compose --profile deploy run --rm --build deploy
  deploy:
    profiles: ["deploy"]
    build:
      context: .
      target: deploy
    environment:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID:
      CLOUDFLARE_API_TOKEN:

  # Static preview of `out/`, which is what Cloudflare Pages serves.
  # Start it with: docker compose --profile preview up --build preview
  preview:
    profiles: ["preview"]
    build:
      context: .
      target: preview
    ports:
      - "8080:80"

volumes:
  web_node_modules:
